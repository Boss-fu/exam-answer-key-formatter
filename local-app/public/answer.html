<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>理化詳解產生器</title><link rel="icon" href="/favicon.ico"><style>
:root{--red:#850103;--line:#e5dfd5;--muted:#807a73}*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}body{margin:0;background:#f8f7f4;color:#2d3038;font:500 16px/1.7 "PingFang TC","Microsoft JhengHei",system-ui,sans-serif}header{background:#fffefb;border-bottom:1px solid var(--line);padding:16px 24px;font-weight:800;display:flex;gap:14px;align-items:center}header img{width:38px;height:38px}main{width:min(760px,calc(100% - 32px));margin:24px auto;padding-bottom:170px}section{background:#fffefb;border:1px solid var(--line);border-radius:15px;padding:24px;margin-bottom:18px;box-shadow:0 2px 9px #2b201c0b}h1{font-size:26px;margin:0}h2{font-size:22px;margin:0}p{margin:8px 0}.muted{color:var(--muted);font-size:14px}.bad,.warning{color:#a14418}.ok{color:#1f6f5c}label{display:block;font-weight:700;margin:16px 0 6px}input,textarea,button{font:inherit;font-size:16px}input[type=text],textarea{width:100%;padding:12px;border:1px solid #d8d5cf;border-radius:10px}textarea{min-height:100px;resize:vertical;overflow:hidden;line-height:1.7}button{min-height:44px;padding:10px 16px;border:1px solid #d8d5cf;border-radius:10px;background:white;cursor:pointer}button.primary{background:var(--red);color:white;width:100%;min-height:52px;margin-top:20px;font-weight:800}button:disabled{opacity:.5;cursor:not-allowed}:focus-visible{outline:3px solid #85010366;outline-offset:2px}[hidden]{display:none!important}.drop{border:2px dashed #d8cbbb;border-radius:12px;padding:24px 12px;text-align:center;cursor:pointer}.drop.over{background:#fbf1ef}.drop input{display:block;max-width:100%;min-height:44px;margin:12px auto}.connection{padding:14px 0;border-bottom:1px solid var(--line);margin:12px 0}#progress,#error,#downloadStatus{white-space:pre-line;overflow-wrap:anywhere}section,details{min-width:0;overflow-wrap:anywhere}details{border:1px solid var(--line);border-radius:12px;margin:14px 0;background:white}details.attention{border:2px solid #bd7c23;background:#fffaf0}summary{cursor:pointer;min-height:64px;padding:16px}.preview,.warning{display:block}.preview{color:var(--muted);font-size:14px;white-space:pre-wrap}.warning{font-weight:700}.editor{padding:0 16px 20px}.answers{display:flex;flex-wrap:wrap;gap:8px}.answers button{min-width:52px;min-height:48px;font-weight:800}.answers button[aria-pressed=true]{background:var(--red);color:white}.filter{display:flex;align-items:center;gap:10px;min-height:44px}.filter input{width:22px;height:22px}fieldset{border:0;padding:0;margin:16px 0;min-width:0}legend{font-weight:700}#downloadBar{position:fixed;bottom:0;left:0;right:0;background:#fffefbf5;border-top:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));z-index:20}#downloadBar>div{max-width:760px;margin:auto}#downloadBar button{margin:0}#downloadStatus{font-size:14px;max-height:70px;overflow:auto}@media(max-width:520px){section{padding:18px}h1{font-size:24px}}
</style></head><body><header><img src="/logo.png" alt="">茲茲文教</header><main><section><h1>理化詳解產生器</h1><p class="muted">上傳 → 產生詳解 → 檢查與修改 → 下載 Word</p><div class="connection" role="status"><div id="connection">正在連線公司電腦…</div><button id="reconnect" type="button" hidden>重新連線</button></div><form id="form"><label class="drop" id="drop">拖放考卷到這裡，或點選檔案<input id="file" type="file" accept=".pdf,.docx,.png,.jpg,.jpeg" aria-label="考卷檔案"><span id="selected" class="muted">PDF、Word（.docx）、PNG、JPG，一次一份</span></label><label for="official">官方答案（選填）</label><input id="official" type="text" placeholder="例如 A D B CE ACE" autocomplete="off"><p class="muted">每題以空白或逗號分隔，多選如 CE；沒有分隔時逐字視為單選，自動轉大寫。</p><label for="filename">檔名（選填）</label><input id="filename" type="text" placeholder="原檔名_詳解"><button id="generate" class="primary" disabled>產生詳解</button></form><div id="progress" role="status"></div><div id="error" class="bad" role="alert"></div></section><section id="result" hidden><h2>檢查與修改</h2><p id="ensembleStatus" role="status"></p><p id="count" role="status"></p><p id="saveStatus" class="muted" role="status"></p><button id="newUpload" type="button">重新上傳另一份</button><label class="filter"><input id="attentionOnly" type="checkbox">只看需要注意的題目</label><div id="list"></div><p id="empty" hidden>沒有需要注意的題目。</p></section></main><div id="downloadBar" hidden><div><p id="downloadStatus" role="status"></p><button id="download" class="primary" type="button">下載 Word</button></div></div><script src="server-config.js"></script><script src="api-client.js"></script><script src="answer-rules.js"></script><script>
'use strict';
const $=id=>document.getElementById(id),target=OcrServerConfig.servers.company,draftPrefix='answer-review:';
let selectedFile=null,ready=false,busy=false,draft=null;
function updateButton(){$('generate').disabled=busy || !ready || !selectedFile;$('download').disabled=busy || !ready || !draft;}
async function connect(){
 ready=false;updateButton();$('reconnect').hidden=true;$('connection').className='';$('connection').textContent='正在連線公司電腦…';
 try{const health=await (await OcrApi.request('/api/health',{signal:AbortSignal.timeout(15000)},target)).json();if(!health.ok)throw new Error('公司電腦暫時無法使用，請稍後重新連線。');ready=(health.capabilities || []).includes('answer-key');$('connection').textContent=ready?'公司電腦已連線（版本 '+(health.revision || health.apiVersion || '未知')+'）':'公司電腦程式版本太舊，請稍候自動更新';$('connection').className=ready?'ok':'bad';}
 catch(error){$('connection').className='bad';$('connection').textContent=error.message;}
 $('reconnect').hidden=ready;updateButton();
}
function choose(files){if(busy)return;$('error').textContent='';if(files.length!==1 || !/\.(pdf|docx|png|jpe?g)$/i.test(files[0].name)){$('error').textContent='請一次選擇一份 PDF、Word（.docx）、PNG 或 JPG 考卷。';return;}if(files[0].size>35*1024*1024){$('error').textContent='檔案太大，每份最多 35MB。';return;}selectedFile=files[0];$('selected').textContent=selectedFile.name;$('filename').value=selectedFile.name.replace(/\.[^.]+$/,'')+'_詳解';updateButton();}
function readFile(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result.split(',')[1]);reader.onerror=()=>reject(new Error('讀取檔案失敗，請重新選擇。'));reader.readAsDataURL(file);});}
async function post(path,body){return OcrApi.request(path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)},target);}
function issues(q){const official=(Array.isArray(draft.official)?draft.official:AnswerRules.parseOfficial(draft.official))[Number(q.no)-1] || '';return {mismatch:AnswerRules.isMismatch(q),manual:AnswerRules.needsReview(q) || !!q.review,official,different:!!official && !AnswerRules.sameAnswers(official,q.answer)};}
function saveDraft(){if(!draft)return;draft.pending=true;try{localStorage.setItem(draft.key,JSON.stringify(draft));$('saveStatus').textContent='修改已自動儲存在這台裝置。';}catch(_){$('saveStatus').textContent='此瀏覽器無法儲存草稿，請在關閉前下載 Word。';}}
function forgetDraft(){try{if(draft)localStorage.removeItem(draft.key);}catch(_){} }
function grow(area){area.style.height='auto';area.style.height=area.scrollHeight+'px';}
function element(tag,text,cls){const el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(cls)el.className=cls;return el;}
function refresh(){let count=0,visible=0;draft.data.questions.forEach((q,i)=>{const state=issues(q),attention=state.mismatch || state.manual || state.different,card=$('q'+i);if(attention)count++;card.classList.toggle('attention',attention);card.hidden=$('attentionOnly').checked && !attention;if(!card.hidden)visible++;card.querySelector('.heading').textContent='第 '+q.no+' 題　答案：'+(q.answer || '未填');card.querySelector('.preview').textContent=Array.from(q.detail || '').slice(0,40).join('');card.querySelector('.warning').textContent=[state.manual?'⚠ 需要人工確認':'',state.mismatch?'⚠ 詳解與答案矛盾':'',state.different?'⚠ 官方：'+state.official:''].filter(Boolean).join('；');const official=card.querySelector('.official');official.hidden=!state.different;official.textContent='改成官方答案 '+state.official;card.querySelectorAll('.answers button').forEach(button=>button.setAttribute('aria-pressed',String(button.textContent===q.answer)));});$('count').textContent='共 '+draft.data.questions.length+' 題・需要注意 '+count+' 題';$('empty').hidden=visible>0;}
function changed(q){draft.mismatches=(draft.mismatches || []).filter(no=>String(no)!==String(q.no));saveDraft();refresh();$('downloadStatus').textContent='';}
function showReview(){
 const e=draft.ensemble;$('ensembleStatus').textContent=!e?'':e.mode==='official'?'?????? Claude ????':'Claude ???ChatGPT'+(e.engines.some(x=>x.name==='gemini')?'?Gemini':'')+'?????'+e.agreed+' ????'+e.disputed.length+' ?????'+e.disputed.filter(x=>!x.resolved).length+' ???????';if(e)$('ensembleStatus').textContent+=e.engines.filter(x=>!x.ok).map(x=>'?'+x.name+' ?????????'+x.error).join('');
 $('form').hidden=true;$('result').hidden=false;$('downloadBar').hidden=false;$('list').replaceChildren();
 draft.data.questions.forEach((q,i)=>{const card=element('details');card.id='q'+i;const summary=element('summary');summary.append(element('strong','','heading'),element('span','','warning'),element('span','','preview'));card.append(summary);const editor=element('div',undefined,'editor'),fieldset=element('fieldset');fieldset.append(element('legend','答案（單選）'));const answers=element('div',undefined,'answers');[...new Set(['A','B','C','D',...(q.options || []).map(o=>o.label),q.answer].filter(Boolean))].forEach(label=>{const button=element('button',label);button.type='button';button.onclick=()=>{q.answer=label;changed(q);};answers.append(button);});fieldset.append(answers);editor.append(fieldset);const official=element('button','','official');official.type='button';official.onclick=()=>{q.answer=issues(q).official;changed(q);};editor.append(official);
 function area(title,value,setValue,id){const label=element('label',title);label.htmlFor=id;const input=element('textarea');input.id=id;input.value=value || '';input.rows=3;input.addEventListener('input',()=>{setValue(input.value);grow(input);changed(q);});editor.append(label,input);}
 area('詳解',q.detail,value=>q.detail=value,'detail'+i);(q.options || []).forEach((o,j)=>area('選項 '+o.label+' 的說明',o.text,value=>o.text=value,'option'+i+'-'+j));card.append(editor);card.addEventListener('toggle',()=>{if(card.open)card.querySelectorAll('textarea').forEach(grow);});$('list').append(card);});refresh();updateButton();
}
function restoreDraft(){const candidates=[];try{for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(!key || !key.startsWith(draftPrefix))continue;try{const value=JSON.parse(localStorage.getItem(key));if(value && value.pending && value.key===key && value.data && Array.isArray(value.data.questions) && (typeof value.official==='string' || Array.isArray(value.official)))candidates.push(value);}catch(_){}}}catch(_){}candidates.sort((a,b)=>b.created-a.created);if(candidates.length && confirm('要繼續上次的修改嗎？')){draft=candidates[0];showReview();$('saveStatus').textContent='已恢復上次未下載的草稿。';}}
$('form').addEventListener('submit',async event=>{
 event.preventDefault();if(busy || !ready || !selectedFile)return;const file=selectedFile;let official;try{official=AnswerRules.parseOfficial($('official').value);}catch(error){$('error').textContent=error.message;return;}const filename=$('filename').value.trim().replace(/\.docx$/i,'') || file.name.replace(/\.[^.]+$/,'')+'_詳解';busy=true;updateButton();['file','official','filename'].forEach(id=>$(id).disabled=true);$('error').textContent='';const start=Date.now(),tick=()=>{$('progress').textContent='處理中，已經過 '+Math.floor((Date.now()-start)/1000)+' 秒\n整份考卷可能要幾分鐘，請不要關閉頁面';};tick();const timer=setInterval(tick,1000);
 try{const result=await (await post('/api/answer-key',{filename:file.name,officialAnswers:Object.fromEntries(official.map((a,i)=>[i+1,a])),dataBase64:await readFile(file)})).json();if(!result.data || !Array.isArray(result.data.questions) || !result.data.questions.length)throw new Error(result.error || '沒有取得題目資料，請重新產生。');const created=Date.now();draft={key:draftPrefix+file.name+':'+created,created,filename,official,ensemble:result.ensemble,data:result.data,mismatches:result.mismatches || [],pending:true};saveDraft();showReview();$('progress').textContent='';$('result').scrollIntoView({behavior:'smooth'});}
 catch(error){$('error').textContent=error.message;$('progress').textContent='';}
 finally{clearInterval(timer);busy=false;['file','official','filename'].forEach(id=>$(id).disabled=false);updateButton();}
});
$('download').addEventListener('click',async ()=>{if(!draft || busy || !ready)return;busy=true;updateButton();$('newUpload').disabled=true;$('list').querySelectorAll('button,textarea').forEach(el=>el.disabled=true);$('downloadStatus').textContent='正在製作 Word…';try{const response=await post('/api/render',{data:draft.data,filename:draft.filename});const blob=await response.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=draft.filename+'.docx';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);forgetDraft();draft.pending=false;$('downloadStatus').textContent='Word 已開始下載。';$('saveStatus').textContent='目前版本已下載；繼續修改會自動儲存新草稿。';}catch(error){$('downloadStatus').textContent=error.message;}finally{busy=false;updateButton();$('newUpload').disabled=false;$('list').querySelectorAll('button,textarea').forEach(el=>el.disabled=false);}});
$('attentionOnly').addEventListener('change',()=>{if(draft)refresh();});
$('newUpload').addEventListener('click',()=>{if(busy || (draft && draft.pending && !confirm('還有未下載的修改，確定要重新上傳另一份嗎？')))return;forgetDraft();draft=null;selectedFile=null;$('form').reset();$('selected').textContent='PDF、Word（.docx）、PNG、JPG，一次一份';$('attentionOnly').checked=false;$('form').hidden=false;$('result').hidden=true;$('downloadBar').hidden=true;$('progress').textContent='';$('error').textContent='';updateButton();window.scrollTo(0,0);});
$('file').addEventListener('change',event=>choose(event.target.files));$('drop').addEventListener('dragover',event=>{event.preventDefault();if(!busy)$('drop').classList.add('over');});$('drop').addEventListener('dragleave',()=>$('drop').classList.remove('over'));$('drop').addEventListener('drop',event=>{event.preventDefault();$('drop').classList.remove('over');choose(event.dataTransfer.files);});$('reconnect').addEventListener('click',connect);restoreDraft();connect();
</script></body></html>
