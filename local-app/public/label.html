<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人工修正工作台</title><link rel="icon" type="image/png" href="./logo.png?v=2"><link rel="shortcut icon" href="./favicon.ico?v=2"><link rel="apple-touch-icon" href="./logo.png?v=2">
<style>body{margin:0;background:#f8f7f4;color:#292724;font:15px system-ui,"Microsoft JhengHei"}header,main{max-width:1100px;margin:auto;padding:14px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:22px;margin:0}.note{background:#fff3df;padding:10px;border-radius:8px}button,input{font:inherit;padding:7px;margin:3px}button{border:1px solid #bba;border-radius:7px;background:white}.on{background:#850103;color:white}.hide{display:none}.tabs button{font-weight:bold}.panel{background:white;border:1px solid #ded8cf;border-radius:10px;padding:14px;margin-top:12px}.canvases{display:flex;gap:10px;overflow:auto}.canvases canvas{max-width:none;border:1px solid #ccc;cursor:crosshair}.lines{max-height:62vh;overflow:auto}.line{display:grid;grid-template-columns:60px 1fr auto auto;gap:6px;padding:5px;border-bottom:1px solid #eee;align-items:center}.line.q{background:#fff1ee}.line.n{opacity:.45;text-decoration:line-through}.line input{min-width:0;width:100%;padding:4px}.status{color:#176c50}.reviewActions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.reviewActions button{font-weight:700;min-height:42px}.reviewActions #pass{background:#176c50;color:#fff;border-color:#176c50}.reviewActions #erase{background:#fff2df;border-color:#d58c29}.reviewActions #restore{background:#edf4ff;border-color:#497abf}@media(max-width:700px){header,main{padding:10px}.line{grid-template-columns:46px 1fr}.line button{font-size:12px}.canvases canvas{width:85vw!important;height:auto}.reviewActions{position:sticky;top:0;z-index:3;background:#fff;padding:8px 0}.reviewActions button{font-size:16px;min-height:50px;flex:1}.reviewActions #size,.reviewActions #zoom{max-width:90px}}</style>
<header><div><h1>人工修正工作台</h1><div>你的修正會成為訓練資料，幫系統越來越準</div></div><span id="pnSlot"></span><a href="./index.html">回 OCR 首頁</a></header><main><div id="stats" class="note">讀取中…</div><p class="tabs"><button id="tabM" class="on">A. 清除筆跡</button><button id="tabQ">B. 修正題目切分</button></p>
<section id="jobPicker" class="panel hide"><h2>最近處理過的考卷</h2><p>請從首頁上傳一次；選擇已處理的考卷即可繼續修正。</p><div id="jobList"></div></section><section id="manual" class="panel"><span id="mstatus" class="status"></span><div id="tools" class="hide"><div class="reviewActions"><button id="prev">←</button><b id="pos"></b><button id="next">→</button><button id="pass">✓ 沒問題，下一頁</button><button id="erase" class="on">漏擦：補清除</button><button id="restore">誤擦：還原</button><label>筆刷 <input id="size" type="range" min="3" max="60" value="14"></label><label>縮放 <input id="zoom" type="range" min="30" max="120" value="60"></label><button id="save">儲存修正並下一頁</button></div><p>流程：先看右側預覽；沒問題按綠色鍵。看到漏掉的筆跡選「補清除」後用 Pencil 圈；印刷字被擦到則選「還原」。</p><div class="canvases"><div>原稿（紅色會被擦）<br><canvas id="left"></canvas></div><div>擦完預覽<br><canvas id="right"></canvas></div></div></div></section>
<section id="questions" class="panel hide"><p><button id="load">讀取草稿</button><button id="saveQ">儲存題目標註</button><button id="rebuild">用人工修正重新產生 Word</button><span id="qstatus" class="status"></span></p><div id="lines" class="lines"></div></section></main>
<script src="./server-config.js"></script><script src="./api-client.js"></script><script src="./patch-notes.js"></script><script>
const $=s=>document.querySelector(s), target=()=>{let k='mac',c='',local=location.hostname==='127.0.0.1'||location.hostname==='localhost';try{k=local?'local':(localStorage.getItem('tzutzu-ocr-server')||'mac');c=localStorage.getItem('tzutzu-ocr-custom')||''}catch(e){} if(k==='local')return{label:'這台電腦',baseUrl:location.origin};if(k==='custom'&&c)return{label:'自訂主機',baseUrl:c};return{label:'目前主機',baseUrl:(OcrServerConfig.servers[k]||OcrServerConfig.servers.mac).baseUrl}};
async function api(p,o={}){let r=await OcrApi.request(p,Object.assign({headers:{'content-type':'application/json'}},o),target());return r.json()} function post(p,x){return api(p,{method:'POST',body:JSON.stringify(x)})}
let page=1,pages=0,gray,mask,ink,W,H,mode=1,last,down=false,decision={q:[],noise:[],fix:[]};const A=left.getContext('2d'),B=right.getContext('2d');
function img(s){return new Promise((r,j)=>{let i=new Image;i.onload=()=>r(i);i.onerror=()=>j(new Error('頁面圖片載入失敗'));i.src=s})} function errorText(e){return e&&e.message?e.message:String(e||'未知錯誤')} async function loadPage(){try{mstatus.textContent='載入頁面中…';let r=await post('/api/label/render',{job: currentJob, page});pages=r.pages;pos.textContent=page+' / '+pages+(r.done?'（已修正）':'');stats.textContent=`累計：去筆跡 ${r.stats.manualPages} 頁、題目 ${r.stats.questionSets} 份`;
let g=await img(r.x),m=await img(r.m);W=g.width;H=g.height;[left,right].forEach(c=>{c.width=W;c.height=H});let c=document.createElement('canvas');c.width=W;c.height=H;let x=c.getContext('2d');x.drawImage(g,0,0);let gd=x.getImageData(0,0,W,H).data;x.clearRect(0,0,W,H);x.drawImage(m,0,0);let md=x.getImageData(0,0,W,H).data;gray=new Uint8Array(W*H);mask=new Uint8Array(W*H);ink=new Uint8Array(W*H);for(let i=0;i<W*H;i++){gray[i]=gd[i*4];mask[i]=md[i*4]>127;ink[i]=gray[i]<170}draw();zoom.oninput()}
catch(e){mstatus.textContent='載入頁面失敗：'+errorText(e)+'，請重試'}finally{if(mstatus.textContent==='載入頁面中…')mstatus.textContent=''}}
function draw(){let a=A.createImageData(W,H),b=B.createImageData(W,H);for(let i=0;i<W*H;i++){let j=i*4,v=mask[i]?255:gray[i];a.data[j]=mask[i]?225:v;a.data[j+1]=mask[i]?45:v;a.data[j+2]=mask[i]?45:v;b.data[j]=b.data[j+1]=b.data[j+2]=v;a.data[j+3]=b.data[j+3]=255}A.putImageData(a,0,0);B.putImageData(b,0,0)}
function paint(e){let r=e.target.getBoundingClientRect(),p=[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height],q=last||p,R=+size.value,n=Math.max(1,Math.hypot(p[0]-q[0],p[1]-q[1])/(R/2));last=p;for(let t=0;t<=n;t++){let cx=q[0]+(p[0]-q[0])*t/n,cy=q[1]+(p[1]-q[1])*t/n;for(let y=Math.max(0,cy-R|0);y<Math.min(H,cy+R);y++)for(let x=Math.max(0,cx-R|0);x<Math.min(W,cx+R);x++)if((x-cx)**2+(y-cy)**2<R*R)mask[y*W+x]=mode&&ink[y*W+x]}draw()}
[left,right].forEach(c=>{c.onpointerdown=e=>{down=true;last=null;paint(e)};c.onpointermove=e=>down&&paint(e)});onpointerup=()=>{down=false;last=null}; erase.onclick=()=>{mode=1;erase.className='on';restore.className=''};restore.onclick=()=>{mode=0;restore.className='on';erase.className=''};zoom.oninput=()=>[left,right].forEach(c=>c.style.width=(W*zoom.value/100)+'px');prev.onclick=()=>{if(page>1){page--;loadPage()}};next.onclick=()=>{if(page<pages){page++;loadPage()}};
function readPdfBase64(f){return new Promise((resolve,reject)=>{let reader=new FileReader;reader.onerror=()=>reject(reader.error||new Error('讀取檔案失敗'));reader.onabort=()=>reject(new Error('讀取檔案已取消'));reader.onload=()=>{let result=String(reader.result||''),comma=result.indexOf(',');if(comma<0)return reject(new Error('檔案格式無法讀取'));resolve(result.slice(comma+1))};reader.readAsDataURL(f)})} function sizeText(n){return(n/1024/1024).toFixed(n>=1024*1024?1:2)+' MB'} async function savePage(){try{mstatus.textContent='存檔中…';let c=document.createElement('canvas');c.width=W;c.height=H;let d=c.getContext('2d').createImageData(W,H);for(let i=0;i<W*H;i++){let v=mask[i]?255:0;d.data[i*4]=d.data[i*4+1]=d.data[i*4+2]=v;d.data[i*4+3]=255}c.getContext('2d').putImageData(d,0,0);await post('/api/label/save-mask',{job: currentJob, page, mask:c.toDataURL("image/png")});if(page<pages){page++;await loadPage()}else mstatus.textContent='已存檔'}catch(e){mstatus.textContent='存檔失敗：'+errorText(e)+'，請重試'}} save.onclick=savePage;pass.onclick=savePage;
function showLines(r){decision=r.decision||{q:[],noise:[],fix:[]};lines.innerHTML='';r.lines.forEach(x=>{let d=document.createElement('div');d.className='line'+(decision.q.includes(x.line)?' q':'')+(decision.noise.includes(x.line)?' n':'');let fix=(decision.fix||[]).find(f=>f.l===x.line);d.innerHTML=`<b>L${x.line}</b><input value="${(fix?fix.to:x.text).replace(/&/g,'&amp;').replace(/"/g,'&quot;')}"><button>新題</button><button>雜訊</button>`;let input=d.querySelector('input'),bs=d.querySelectorAll('button');bs[0].onclick=()=>{decision.q=decision.q.includes(x.line)?decision.q.filter(n=>n!==x.line):[...decision.q,x.line];d.classList.toggle('q')};bs[1].onclick=()=>{decision.noise=decision.noise.includes(x.line)?decision.noise.filter(n=>n!==x.line):[...decision.noise,x.line];d.classList.toggle('n')};input.onchange=()=>{decision.fix=(decision.fix||[]).filter(f=>f.l!==x.line);if(input.value!==x.text)decision.fix.push({l:x.line,from:x.text,to:input.value})};lines.appendChild(d)})}
const query=new URLSearchParams(location.search),requestedJob=query.get("job"),requestedTab=query.get("tab"),requestedPage=Math.max(1,Number(query.get("page"))||1);let currentJob=requestedJob;
function selectJob(job){currentJob=job;page=requestedPage;jobPicker.classList.add('hide');manual.classList.remove('hide');tools.classList.remove('hide');if(requestedTab==='questions')openQuestions();else loadPage()}
function openQuestions(){manual.classList.add('hide');questions.classList.remove('hide');tabQ.className='on';tabM.className='';if(currentJob)load.onclick()}
function showJobList(jobs){jobPicker.classList.remove('hide');manual.classList.add('hide');jobList.replaceChildren();if(!jobs.length){jobList.textContent='目前沒有已處理的考卷。';return}jobs.forEach(job=>{let button=document.createElement('button');button.textContent=job.name;button.onclick=()=>selectJob(job.id);jobList.appendChild(button)})}
async function jobsLoad(){try{let r=await post('/api/label/list',{}),jobs=r.jobs||[];stats.textContent='累計：去筆跡 '+r.stats.manualPages+' 頁、題目 '+r.stats.questionSets+' 份';if(requestedJob&&jobs.some(job=>job.id===requestedJob))selectJob(requestedJob);else showJobList(jobs)}catch(e){stats.textContent='工作清單載入失敗：'+errorText(e)+'，請回首頁重試';console.error(e)}}
load.onclick=async()=>{if(!currentJob)return;try{qstatus.textContent='讀取草稿中…';showLines(await post('/api/label/draft',{job:currentJob}));qstatus.textContent=''}catch(e){qstatus.textContent='讀取草稿失敗：'+errorText(e)+'，請重試'}};saveQ.onclick=async()=>{try{qstatus.textContent='儲存題目中…';await post('/api/label/save-questions',{job:currentJob,data:decision});qstatus.textContent='已儲存'}catch(e){qstatus.textContent='儲存題目失敗：'+errorText(e)+'，請重試'}};rebuild.onclick=async()=>{try{qstatus.textContent='重建 Word 中…';let r=await post('/api/label/rebuild',{job:currentJob});location.href=OcrApi.apiUrl(r.downloadUrl,target());qstatus.textContent=''}catch(e){qstatus.textContent='重建 Word 失敗：'+errorText(e)+'，請重試'}};tabM.onclick=()=>{manual.classList.remove('hide');questions.classList.add('hide');tabM.className='on';tabQ.className='';if(currentJob){page=requestedPage;loadPage()}};tabQ.onclick=openQuestions;void jobsLoad();
</script><script>try{TzutzuPatchNotes.mountButton(document.getElementById("pnSlot"))}catch(e){}</script></html>
