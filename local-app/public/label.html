<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人工修正工作台</title>
<style>body{margin:0;background:#f8f7f4;color:#292724;font:15px system-ui,"Microsoft JhengHei"}header,main{max-width:1100px;margin:auto;padding:14px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:22px;margin:0}.note{background:#fff3df;padding:10px;border-radius:8px}button,input{font:inherit;padding:7px;margin:3px}button{border:1px solid #bba;border-radius:7px;background:white}.on{background:#850103;color:white}.hide{display:none}.tabs button{font-weight:bold}.panel{background:white;border:1px solid #ded8cf;border-radius:10px;padding:14px;margin-top:12px}.canvases{display:flex;gap:10px;overflow:auto}.canvases canvas{max-width:none;border:1px solid #ccc;cursor:crosshair}.lines{max-height:62vh;overflow:auto}.line{display:grid;grid-template-columns:60px 1fr auto auto;gap:6px;padding:5px;border-bottom:1px solid #eee;align-items:center}.line.q{background:#fff1ee}.line.n{opacity:.45;text-decoration:line-through}.line input{min-width:0;width:100%;padding:4px}.status{color:#176c50}@media(max-width:700px){.line{grid-template-columns:46px 1fr}.line button{font-size:12px}.canvases canvas{width:85vw!important;height:auto}}</style>
<header><div><h1>人工修正工作台</h1><div>你的修正會成為訓練資料，幫系統越來越準</div></div><a href="./index.html">回 OCR 首頁</a></header><main><div id="stats" class="note">讀取中…</div><p class="tabs"><button id="tabM" class="on">A. 清除筆跡</button><button id="tabQ">B. 修正題目切分</button></p>
<section id="manual" class="panel"><label>上傳 PDF <input id="pdf" type="file" accept="application/pdf"></label><span id="mstatus" class="status"></span><div id="tools" class="hide"><p><button id="prev">← 上頁</button><b id="pos"></b><button id="next">下頁 →</button><button id="erase" class="on">消除筆</button><button id="restore">還原筆</button> 筆刷 <input id="size" type="range" min="3" max="60" value="14"> 縮放 <input id="zoom" type="range" min="30" max="120" value="60"> <button id="save">存檔並下一頁</button></p><div class="canvases"><div>原稿（紅色會被擦）<br><canvas id="left"></canvas></div><div>擦完預覽<br><canvas id="right"></canvas></div></div></div></section>
<section id="questions" class="panel hide"><p><select id="jobs"></select><button id="load">讀取草稿</button><button id="saveQ">儲存題目標註</button><button id="rebuild">用人工修正重新產生 Word</button><span id="qstatus" class="status"></span></p><div id="lines" class="lines"></div></section></main>
<script src="./server-config.js"></script><script src="./api-client.js"></script><script>
const $=s=>document.querySelector(s), target=()=>({label:'目前主機',baseUrl:OcrServerConfig.servers[localStorage.getItem('tzutzu-ocr-server')||'mac']?.baseUrl||OcrServerConfig.servers.mac.baseUrl});
async function api(p,o={}){let r=await OcrApi.request(p,Object.assign({headers:{'content-type':'application/json'}},o),target());return r.json()} function post(p,x){return api(p,{method:'POST',body:JSON.stringify(x)})}
let id,page=1,pages=0,gray,mask,ink,W,H,mode=1,last,down=false,decision={q:[],noise:[],fix:[]};const A=left.getContext('2d'),B=right.getContext('2d');
function img(s){return new Promise((r,j)=>{let i=new Image;i.onload=()=>r(i);i.onerror=()=>j(new Error('頁面圖片載入失敗'));i.src=s})} function errorText(e){return e&&e.message?e.message:String(e||'未知錯誤')} async function loadPage(){try{mstatus.textContent='載入頁面中…';let r=await post('/api/label/render',{id,page});pages=r.pages;pos.textContent=page+' / '+pages+(r.done?'（已修正）':'');stats.textContent=`累計：去筆跡 ${r.stats.manualPages} 頁、題目 ${r.stats.questionSets} 份`;
let g=await img(r.x),m=await img(r.m);W=g.width;H=g.height;[left,right].forEach(c=>{c.width=W;c.height=H});let c=document.createElement('canvas');c.width=W;c.height=H;let x=c.getContext('2d');x.drawImage(g,0,0);let gd=x.getImageData(0,0,W,H).data;x.clearRect(0,0,W,H);x.drawImage(m,0,0);let md=x.getImageData(0,0,W,H).data;gray=new Uint8Array(W*H);mask=new Uint8Array(W*H);ink=new Uint8Array(W*H);for(let i=0;i<W*H;i++){gray[i]=gd[i*4];mask[i]=md[i*4]>127;ink[i]=gray[i]<170}draw();zoom.oninput()}
catch(e){mstatus.textContent='載入頁面失敗：'+errorText(e)+'，請重試'}finally{if(mstatus.textContent==='載入頁面中…')mstatus.textContent=''}}
function draw(){let a=A.createImageData(W,H),b=B.createImageData(W,H);for(let i=0;i<W*H;i++){let j=i*4,v=mask[i]?255:gray[i];a.data[j]=mask[i]?225:v;a.data[j+1]=mask[i]?45:v;a.data[j+2]=mask[i]?45:v;b.data[j]=b.data[j+1]=b.data[j+2]=v;a.data[j+3]=b.data[j+3]=255}A.putImageData(a,0,0);B.putImageData(b,0,0)}
function paint(e){let r=e.target.getBoundingClientRect(),p=[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height],q=last||p,R=+size.value,n=Math.max(1,Math.hypot(p[0]-q[0],p[1]-q[1])/(R/2));last=p;for(let t=0;t<=n;t++){let cx=q[0]+(p[0]-q[0])*t/n,cy=q[1]+(p[1]-q[1])*t/n;for(let y=Math.max(0,cy-R|0);y<Math.min(H,cy+R);y++)for(let x=Math.max(0,cx-R|0);x<Math.min(W,cx+R);x++)if((x-cx)**2+(y-cy)**2<R*R)mask[y*W+x]=mode&&ink[y*W+x]}draw()}
[left,right].forEach(c=>{c.onpointerdown=e=>{down=true;last=null;paint(e)};c.onpointermove=e=>down&&paint(e)});onpointerup=()=>{down=false;last=null}; erase.onclick=()=>{mode=1;erase.className='on';restore.className=''};restore.onclick=()=>{mode=0;restore.className='on';erase.className=''};zoom.oninput=()=>[left,right].forEach(c=>c.style.width=(W*zoom.value/100)+'px');prev.onclick=()=>{if(page>1){page--;loadPage()}};next.onclick=()=>{if(page<pages){page++;loadPage()}};
function readPdfBase64(f){return new Promise((resolve,reject)=>{let reader=new FileReader;reader.onerror=()=>reject(reader.error||new Error('讀取檔案失敗'));reader.onabort=()=>reject(new Error('讀取檔案已取消'));reader.onload=()=>{let result=String(reader.result||''),comma=result.indexOf(',');if(comma<0)return reject(new Error('檔案格式無法讀取'));resolve(result.slice(comma+1))};reader.readAsDataURL(f)})} function sizeText(n){return(n/1024/1024).toFixed(n>=1024*1024?1:2)+' MB'} pdf.onchange=async()=>{let f=pdf.files[0];if(!f)return;if(f.size>40*1024*1024){mstatus.textContent='檔案超過 40MB，請壓縮 PDF 後再上傳';pdf.value='';return}let started=Date.now(),ticker=setInterval(()=>mstatus.textContent=`上傳中… ${sizeText(f.size)}，已 ${Math.floor((Date.now()-started)/1000)} 秒`,1000);mstatus.textContent=`上傳中… ${sizeText(f.size)}，已 0 秒`;try{let s=await readPdfBase64(f);let r=await post('/api/label/upload',{dataBase64:s});clearInterval(ticker);ticker=0;id=r.id;tools.classList.remove('hide');page=1;mstatus.textContent='';await loadPage()}catch(e){mstatus.textContent='上傳失敗：'+errorText(e)+'，請重試'}finally{if(ticker)clearInterval(ticker)}};save.onclick=async()=>{try{mstatus.textContent='存檔中…';let c=document.createElement('canvas');c.width=W;c.height=H;let d=c.getContext('2d').createImageData(W,H);for(let i=0;i<W*H;i++){let v=mask[i]?255:0;d.data[i*4]=d.data[i*4+1]=d.data[i*4+2]=v;d.data[i*4+3]=255}c.getContext('2d').putImageData(d,0,0);await post('/api/label/save-mask',{id,page,mask:c.toDataURL('image/png')});if(page<pages){page++;await loadPage()}else mstatus.textContent='已存檔'}catch(e){mstatus.textContent='存檔失敗：'+errorText(e)+'，請重試'}};
function showLines(r){decision=r.decision||{q:[],noise:[],fix:[]};lines.innerHTML='';r.lines.forEach(x=>{let d=document.createElement('div');d.className='line'+(decision.q.includes(x.line)?' q':'')+(decision.noise.includes(x.line)?' n':'');let fix=(decision.fix||[]).find(f=>f.l===x.line);d.innerHTML=`<b>L${x.line}</b><input value="${(fix?fix.to:x.text).replace(/&/g,'&amp;').replace(/"/g,'&quot;')}"><button>新題</button><button>雜訊</button>`;let input=d.querySelector('input'),bs=d.querySelectorAll('button');bs[0].onclick=()=>{decision.q=decision.q.includes(x.line)?decision.q.filter(n=>n!==x.line):[...decision.q,x.line];d.classList.toggle('q')};bs[1].onclick=()=>{decision.noise=decision.noise.includes(x.line)?decision.noise.filter(n=>n!==x.line):[...decision.noise,x.line];d.classList.toggle('n')};input.onchange=()=>{decision.fix=(decision.fix||[]).filter(f=>f.l!==x.line);if(input.value!==x.text)decision.fix.push({l:x.line,from:x.text,to:input.value})};lines.appendChild(d)})}
const requestedJob=new URLSearchParams(location.search).get('job');
async function jobsLoad(){try{qstatus.textContent='載入工作清單中…';let r=await post('/api/label/list',{});jobs.innerHTML=r.jobs.map(j=>`<option value="${j.id}">${j.name}</option>`).join('');if(requestedJob&&Array.from(jobs.options).some(o=>o.value===requestedJob))jobs.value=requestedJob;stats.textContent=`累計：去筆跡 ${r.stats.manualPages} 頁、題目 ${r.stats.questionSets} 份`;qstatus.textContent=''}catch(e){qstatus.textContent='載入工作清單失敗：'+errorText(e)+'，請重試'}};load.onclick=async()=>{try{qstatus.textContent='讀取草稿中…';showLines(await post('/api/label/draft',{job:jobs.value}));qstatus.textContent=''}catch(e){qstatus.textContent='讀取草稿失敗：'+errorText(e)+'，請重試'}};saveQ.onclick=async()=>{try{qstatus.textContent='儲存題目中…';await post('/api/label/save-questions',{job:jobs.value,data:decision});qstatus.textContent='已儲存'}catch(e){qstatus.textContent='儲存題目失敗：'+errorText(e)+'，請重試'}};rebuild.onclick=async()=>{try{qstatus.textContent='重建 Word 中…';let r=await post('/api/label/rebuild',{job:jobs.value});location.href=OcrApi.apiUrl(r.downloadUrl,target());qstatus.textContent=''}catch(e){qstatus.textContent='重建 Word 失敗：'+errorText(e)+'，請重試'}};tabM.onclick=()=>{manual.classList.remove('hide');questions.classList.add('hide');tabM.className='on';tabQ.className=''};tabQ.onclick=()=>{manual.classList.add('hide');questions.classList.remove('hide');tabQ.className='on';tabM.className='';void jobsLoad()};void jobsLoad();
</script></html>
